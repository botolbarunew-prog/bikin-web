backend:
  name: turbo-github
  turbo_site_id: 24cb80a6-1699-4126-ad2a-0b6aa6527a3d
  branch: main

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: pengaturan
    label: "Pengaturan Situs"
    sortable_fields: ["commit_date"]
    files:
      - name: site
        label: "Data perusahaan, kontak, dan WhatsApp"
        file: "src/_data/site.json"
        fields:
          - {label: "Nama payung (induk)", name: nama, widget: string}
          - {label: "Tagline", name: tagline, widget: text}
          - {label: "Alamat fisik resmi", name: address, widget: string}
          - {label: "Email resmi", name: email, widget: string}
          - {label: "Nama penulis default", name: author, widget: string}
          - {label: "Peran penulis default", name: authorRole, widget: string}
          - label: "WhatsApp 1 (Grosir Botol & Gizi Prima)"
            name: whatsapp_1
            widget: object
            fields:
              - {label: "Label", name: label, widget: string}
              - {label: "Peran", name: role, widget: string}
              - {label: "Nomor (format 62...)", name: number, widget: string}
              - {label: "Tampilan nomor", name: display, widget: string}
              - {label: "Lini yang dilayani (slug)", name: units, widget: list}
          - label: "WhatsApp 2 (Jas Hujan Topi & Digital Marketing)"
            name: whatsapp_2
            widget: object
            fields:
              - {label: "Label", name: label, widget: string}
              - {label: "Peran", name: role, widget: string}
              - {label: "Nomor (format 62...)", name: number, widget: string}
              - {label: "Tampilan nomor", name: display, widget: string}
              - {label: "Lini yang dilayani (slug)", name: units, widget: list}
          - {label: "Pesan WA default", name: pesanDefault, widget: text}
          - {label: "Poin kepercayaan di halaman produk", name: tepercaya, widget: list}
          - {label: "Langkah pemesanan (3 langkah)", name: langkah, widget: list}

  - name: lini
    label: "Lini"
    folder: "src/lini"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    extension: md
    format: frontmatter
    fields:
      - {label: "Nama lini", name: title, widget: string}
      - {label: "Slug (URL)", name: slug, widget: hidden, required: false}
      - {label: "Urutan tampil", name: urutan, widget: number, value_type: int, default: 99, hint: "1 = paling depan"}
      - {label: "Deskripsi singkat", name: description, widget: text, hint: "Dipakai untuk SEO dan kartu"}
      - {label: "Gambar lini (opsional)", name: gambar, widget: image, required: false}
      - {label: "Pesan WA default untuk lini ini", name: pesanWa, widget: text}
      - {label: "Status", name: status, widget: select, options: [aktif, segera], default: segera}
      - {label: "Isi halaman", name: body, widget: markdown, required: false}

  - name: jenis
    label: "Jenis Produk"
    folder: "src/jenis"
    view_filters:
      - {label: "Grosir Botol", field: lini, pattern: "^grosir-botol$"}
      - {label: "Gizi Prima", field: lini, pattern: "^gizi-prima$"}
      - {label: "Jas Hujan & Topi", field: lini, pattern: "^jas-hujan-topi$"}
      - {label: "Digital Marketing", field: lini, pattern: "^digital-marketing$"}
    create: true
    slug: "{{slug}}"
    identifier_field: title
    extension: md
    format: frontmatter
    fields:
      - {label: "Nama jenis", name: title, widget: string}
      - {label: "Slug (URL)", name: slug, widget: hidden, required: false}
      - {label: "Urutan tampil", name: urutan, widget: number, value_type: int, default: 99, hint: "1 = paling depan"}
      - {label: "Lini", name: lini, widget: relation, collection: lini, search_fields: [title], value_field: slug, display_fields: [title]}
      - {label: "Deskripsi singkat", name: description, widget: text, hint: "Dipakai untuk SEO"}
      - {label: "Isi halaman", name: body, widget: markdown, required: false}

  - name: produk
    label: "Produk"
    folder: "src/produk"
    view_filters:
      - {label: "Grosir Botol", field: lini, pattern: "^grosir-botol$"}
      - {label: "Gizi Prima", field: lini, pattern: "^gizi-prima$"}
      - {label: "Jas Hujan & Topi", field: lini, pattern: "^jas-hujan-topi$"}
      - {label: "Digital Marketing", field: lini, pattern: "^digital-marketing$"}
      - {label: "Botol Plastik", field: jenis, pattern: "^botol-plastik$"}
      - {label: "Toples", field: jenis, pattern: "^toples$"}
      - {label: "Cup Custom", field: jenis, pattern: "^cup-custom$"}
      - {label: "Kantong Plastik", field: jenis, pattern: "^kantong-plastik$"}
    create: true
    slug: "{{slug}}"
    identifier_field: title
    extension: md
    format: frontmatter
    fields:
      - {label: "Nama produk", name: title, widget: string}
      - {label: "Slug (URL)", name: slug, widget: hidden, required: false}
      - {label: "Lini", name: lini, widget: relation, collection: lini, search_fields: [title], value_field: slug, display_fields: [title]}
      - {label: "Jenis", name: jenis, widget: relation, collection: jenis, search_fields: [title], value_field: slug, display_fields: [title]}
      - {label: "Deskripsi singkat", name: description, widget: text, hint: "Dipakai untuk SEO dan halaman produk"}
      - {label: "Spesifikasi kunci untuk kartu", name: spek, widget: string, required: false, hint: "Contoh: PET · 250ml – 1L"}
      - {label: "Foto utama", name: foto, widget: image, required: false}
      - label: "Galeri foto"
        hint: "3 sampai 5 foto"
        name: galeri
        widget: list
        required: false
        field: {label: "Foto", name: foto, widget: image}
      - label: "Spesifikasi"
        hint: "Tabel di halaman produk"
        name: spesifikasi
        widget: list
        required: false
        fields:
          - {label: "Nama spesifikasi", name: label, widget: string, hint: "Misal: Bahan"}
          - {label: "Nilai", name: nilai, widget: string}
      - label: "Pilihan varian"
        name: varian
        widget: list
        required: false
        fields:
          - {label: "Nama grup", name: nama, widget: string, hint: "Misal: Ukuran"}
          - {label: "Tampilan pilihan", name: tampilan, widget: select, options: [teks, gambar], default: teks}
          - label: "Opsi"
            name: opsi
            widget: list
            fields:
              - {label: "Nama opsi", name: nama, widget: string, hint: "Misal: 500ml atau putih"}
              - {label: "Gambar opsi", name: gambar, widget: image, required: false, hint: "Isi jika tampilan gambar"}
      - {label: "Produk dari lini lain (opsional)", name: produkLintas, widget: relation, collection: produk, multiple: true, required: false, search_fields: [title], value_field: slug, display_fields: [title]}
      - {label: "Isi halaman", name: body, widget: markdown, required: false}

  - name: artikel
    label: "Artikel"
    folder: "src/artikel"
    view_filters:
      - {label: "Umum", field: lini, pattern: "^$"}
      - {label: "Grosir Botol", field: lini, pattern: "^grosir-botol$"}
      - {label: "Gizi Prima", field: lini, pattern: "^gizi-prima$"}
      - {label: "Jas Hujan & Topi", field: lini, pattern: "^jas-hujan-topi$"}
      - {label: "Digital Marketing", field: lini, pattern: "^digital-marketing$"}
    create: true
    slug: "{{slug}}"
    identifier_field: title
    extension: md
    format: frontmatter
    fields:
      - {label: "Judul", name: title, widget: string}
      - {label: "Slug (URL)", name: slug, widget: hidden, required: false}
      - {label: "Lini utama", name: lini, widget: relation, collection: lini, search_fields: [title], value_field: slug, display_fields: [title], required: false, hint: "Kosongkan kalau artikel umum (tidak terikat satu lini)"}
      - {label: "Jenis terkait", name: jenis, widget: relation, multiple: true, collection: jenis, search_fields: [title], value_field: slug, display_fields: [title], hint: "Bisa lebih dari satu"}
      - {label: "Lintas lini", name: lintas, widget: hidden, default: false, required: false}
      - {label: "Deskripsi SEO", name: description, widget: text, hint: "Ringkasan singkat untuk mesin pencari"}
      - {label: "Tanggal terbit", name: tanggal, widget: datetime, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Tanggal diperbarui (opsional)", name: updatedDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: "Penulis", name: author, widget: string, required: false, hint: "Kosongkan untuk memakai penulis default"}
      - {label: "Peran penulis", name: authorRole, widget: string, required: false, hint: "Kosongkan untuk memakai peran default"}
      - {label: "Foto sampul (opsional)", name: foto, widget: image, required: false}
      - {label: "Produk yang dibahas", name: produkTerkait, widget: relation, multiple: true, required: false, collection: produk, search_fields: [title], value_field: slug, display_fields: [title]}
      - {label: "Isi artikel", name: body, widget: markdown}

  - name: halaman
    label: "Halaman"
    files:
      - name: tentang-kami
        label: "Tentang Kami"
        file: "src/tentang-kami.md"
        fields:
          - {label: "Judul halaman", name: title, widget: string}
          - {label: "Deskripsi untuk SEO", name: description, widget: text, hint: "Ringkasan singkat untuk mesin pencari"}
          - {label: "Isi halaman", name: body, widget: markdown}
          - {label: "Layout", name: layout, widget: hidden, default: "layouts/halaman.njk", required: false}
          - {label: "Alamat halaman", name: permalink, widget: hidden, default: "/tentang-kami/", required: false}
      - name: syarat
        label: "Syarat & Ketentuan"
        file: "src/syarat.md"
        fields:
          - {label: "Judul halaman", name: title, widget: string}
          - {label: "Deskripsi untuk SEO", name: description, widget: text, hint: "Ringkasan singkat untuk mesin pencari"}
          - {label: "Isi halaman", name: body, widget: markdown}
          - {label: "Layout", name: layout, widget: hidden, default: "layouts/halaman.njk", required: false}
          - {label: "Alamat halaman", name: permalink, widget: hidden, default: "/syarat/", required: false}
      - name: kebijakan-privasi
        label: "Kebijakan Privasi"
        file: "src/kebijakan-privasi.md"
        fields:
          - {label: "Judul halaman", name: title, widget: string}
          - {label: "Deskripsi untuk SEO", name: description, widget: text, hint: "Ringkasan singkat untuk mesin pencari"}
          - {label: "Isi halaman", name: body, widget: markdown}
          - {label: "Layout", name: layout, widget: hidden, default: "layouts/halaman.njk", required: false}
          - {label: "Alamat halaman", name: permalink, widget: hidden, default: "/kebijakan-privasi/", required: false}
